name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: jvmTest
            os: ubuntu-latest
          - target: linuxX64Test
            os: ubuntu-latest
          - target: testAndroidHostTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Point compileSdk 37 at the installed platform
        if: matrix.target == 'testAndroidHostTest'
        run: |
          # ubuntu-latest already has the SDK. setup-android still requests the
          # removed `tools` package, and API 37 is published as android-37.0
          # while AGP looks up android-37.
          platform="${ANDROID_SDK_ROOT}/platforms"
          if [ ! -e "$platform/android-37" ] && [ -d "$platform/android-37.0" ]; then
            sudo ln -s android-37.0 "$platform/android-37"
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
      - name: Run ${{ matrix.target }}
        run: ./gradlew :qr:${{ matrix.target }} --no-daemon
